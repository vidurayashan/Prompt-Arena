# Prompt Arena Configuration
# --------------------------
# Set your OpenAI API key in the .env file at the project root (see .env.example).
# Do NOT paste the key here — this file is committed to git.

# Model used to run the student's prompt against the document
task_model: "gpt-4o-mini"
# task_model: "meta-llama/llama-guard-4-12b"
# Base URL for the task model provider. Leave empty ("") to use OpenAI.
# OpenRouter example: "https://openrouter.ai/api/v1"
# Ollama example:     "http://localhost:11434/v1"
# task_provider_base_url: "https://openrouter.ai/api/v1"

# Model used as the LLM judge to score the student's output
judge_model: "gpt-4o-mini"
# Base URL for the judge model provider. Leave empty ("") to use OpenAI.
judge_provider_base_url: ""

# Temperature for the judge model (0.0 = fully deterministic).
# If unset or null, the provider default temperature is used.
judge_temperature: 0.0

# Global judge persona: "strict" or "generous"
#   strict   - detailed partial-credit rubric; zeros for wrong figures or missing identifiers
#   generous - full marks for correct core info regardless of phrasing; zeros only for
#              wrong/absent facts or missing critical identifiers
# Individual tasks can override this with a "judge_persona" field on the task entry.
judge_persona: "strict"

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
# Each task needs:
#   id            - unique slug (no spaces)
#   name          - display name shown to students
#   task_type     - "Document", "Prompt", or "Chat"
#   description   - short instructions shown on the task page
#   judge_persona - optional: "strict" or "generous" (overrides global judge_persona)
#
# For task_type = "Document":
#   document      - path to the PDF file (relative to the project root)
#   items         - list of information pieces students must extract
#     id          - integer (used in scoring)
#     label       - what students see (the thing they need to extract)
#     answer      - correct answer (NEVER shown to students)
#
# For task_type = "Prompt":
#   judge_prompt  - LLM prompt used to grade either the student's prompt or the LLM output
#   evaluate_what - what the judge evaluates: "prompt" (student's prompt text) or "output" (LLM output)

# For task_type = "Chat":
#   judge_prompt  - LLM prompt used to grade the full chat conversation
#   (the judge evaluates both student prompts and AI outputs together as one conversation)
# ---------------------------------------------------------------------------
