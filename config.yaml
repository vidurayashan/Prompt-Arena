  - id: task_snack_brand_prompt
    name: "Snack Brand for Uni Café"
    task_type: "Prompt"
    description: >
      You are launching a new snack brand at the university café and want to use AI to help with the launch. You are going to leverage the capabilities of AI to support your launch.
    instructions:
      - verb: "Read"
        text: "the scenario."
      - verb: "Write"
        text: "a prompt and submit."
      - verb: "Review"
        text: "your prompt based on feedback."
    prompt_panel_body: >
      Write a prompt to get creative names for your snack brand.
    prompt_panel_title: "Write your prompt"
    prompt_placeholder: "Generate 5 snack brand names. Remember: Writing Task = Short Input → Long Output"
    judge_persona: "generous"
    judge_prompt: |
      ### LLM Judge Prompt

      You are an evaluator assessing the quality of a student's prompt.

      ---

      ### Context
      The student’s task is to write a prompt that instructs an AI to generate **5 names for a new snack brand at a university café**.

      ---

      ### Your Task
      Evaluate the student’s prompt and assign a score out of **20 marks** based on the criteria below.

      ---

      ### Marking Criteria (Total = 100 marks)

      #### 1. Clarity (25 marks)
      - Is the prompt clear and easy to understand?
      - Are instructions unambiguous?

      #### 2. Task Alignment (25 marks)
      - Does the prompt clearly ask for **5 snack brand names**?
      - Is the university café context included?

      #### 3. Specificity (25 marks)
      - Does the prompt include useful details (e.g., target audience, tone, style, creativity)?
      - Does it guide the AI beyond a generic request?

      #### 4. Prompt Quality (25 marks)
      - Is the prompt well-structured and effective for an LLM?
      - Does it encourage relevant and creative outputs?

      ---

      ### Output Format

      - **Score:** X/100  
      - **Breakdown:**  
        - Clarity: X/25  
        - Task Alignment: X/25  
        - Specificity: X/25  
        - Prompt Quality: X/25  
      - **Feedback:** 2–3 sentences explaining strengths and areas for improvement.

      ---

      ### Notes
      - If the prompt is incomplete or does not match the task, give a low score and explain why.
    evaluate_what: "output"