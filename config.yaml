# Prompt Arena Configuration
# --------------------------
# Set your OpenAI API key in the .env file at the project root (see .env.example).
# Do NOT paste the key here — this file is committed to git.

# Model used to run the student's prompt against the document
task_model: "gpt-4o-mini"
# task_model: "meta-llama/llama-guard-4-12b"
# Base URL for the task model provider. Leave empty ("") to use OpenAI.
# OpenRouter example: "https://openrouter.ai/api/v1"
# Ollama example:     "http://localhost:11434/v1"
# task_provider_base_url: "https://openrouter.ai/api/v1"

# Model used as the LLM judge to score the student's output
judge_model: "gpt-4o-mini"
# Base URL for the judge model provider. Leave empty ("") to use OpenAI.
judge_provider_base_url: ""

# Temperature for the judge model (0.0 = fully deterministic).
# If unset or null, the provider default temperature is used.
judge_temperature: 0.0

# ---------------------------------------------------------------------------
# Leaderboard / Student Prompts cutoff
# ---------------------------------------------------------------------------
# If set, leaderboard, Student Prompts, history, and "previous best" will only
# include submissions with submitted_at >= this timestamp.
# Use a timezone-aware timestamp (recommended), e.g.:
#   data_cutoff_after: "2026-03-18T00:00:00+00:00"
# Or a Postgres-style timestamptz string, e.g.:
#   data_cutoff_after: "2026-03-08 18:10:24.805457+00"
# Leave blank or remove to include all historical data.
# data_cutoff_after: "2026-03-18 23:00:24.805457+00"

# Master / global leaderboard now sums best scores across ALL currently published
# tasks (see GET /api/master-leaderboard). This list is unused; kept for reference.
# master_leaderboard_task_ids:
#   - task_snack_brand_prompt
#   - task_customer_email_emotion
#   - chat_snack_cafe_social_media
#   - task_chain_of_thought_enterprise_billing
#   - task_interview_pattern_job_description
#   - task_playoff_method_tagline
#   - task_tree_of_thought_expansion

# Global judge persona: "strict" or "generous"
#   strict   - detailed partial-credit rubric; zeros for wrong figures or missing identifiers
#   generous - full marks for correct core info regardless of phrasing; zeros only for
#              wrong/absent facts or missing critical identifiers
# Individual tasks can override this with a "judge_persona" field on the task entry.
judge_persona: "strict"

# Pre-prompt integrity judge (runs before normal scoring on all tasks).
# Detects prompts that paste document answers instead of writing extraction instructions.
# Per-task override key: pre_prompt_judge_prompt (also editable in Admin Workshop Control).
pre_prompt_judge_prompt: |
  You are an integrity checker for a university AI workshop.

  Students must write a PROMPT that instructs an AI to extract or produce information.
  They must NOT paste the final answers / extracted facts into their prompt and submit that.

  Flag the submission when the student prompt clearly contains specific answer values
  (names, dates, diagnoses, dollar amounts, identifiers, etc.) that look like they were
  copied from a source document or answer key, rather than instructions for an AI.

  Do NOT flag ordinary good prompts that only describe what to extract (e.g. "Extract the
  patient full name and date of birth") without including the actual values.

  Respond ONLY with JSON:
  {"flagged": true|false, "reason": "<short explanation>"}

# Student-facing message when the pre-prompt judge flags a submission.
pre_prompt_rejected_message: >
  The purpose of this task is to extract information from the document using your prompt,
  not to include the answers in the prompt itself.

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
# Each task needs:
#   id            - unique slug (no spaces)
#   name          - display name shown to students
#   task_type     - "Document", "Prompt", or "Chat"
#   description   - short instructions shown on the task page
#   judge_persona - optional: "strict" or "generous" (overrides global judge_persona)
#
# For task_type = "Document":
#   document      - path to the PDF file (relative to the project root)
#   items         - list of information pieces students must extract
#     id          - integer (used in scoring)
#     label       - what students see (the thing they need to extract)
#     answer      - correct answer (NEVER shown to students)
#
# For task_type = "Prompt":
#   judge_prompt  - LLM prompt used to grade either the student's prompt or the LLM output
#   evaluate_what - what the judge evaluates: "prompt" (student's prompt text) or "output" (LLM output)

# For task_type = "Chat":
#   judge_prompt  - LLM prompt used to grade the full chat conversation
#   (the judge evaluates both student prompts and AI outputs together as one conversation)
# ---------------------------------------------------------------------------
tasks:
  - id: task1
    name: "Task 1: Patient Medical Report"
    task_type: "Document"
    description: >
      Below is a patient medical report. Write a prompt that instructs the AI
      to extract the required information from this document as accurately as possible.
    document: "documents/sample_medical_report.pdf"
    items:
      - id: 1
        label: "Patient full name"
        answer: "Emily Carter"
      - id: 2
        label: "Date of birth"
        answer: "14 March 1987"
      - id: 3
        label: "Primary diagnosis"
        answer: "Type 2 Diabetes Mellitus"
      - id: 4
        label: "Attending physician"
        answer: "Dr. James Harrington"
      - id: 5
        label: "Prescribed medication"
        answer: "Metformin 500 mg twice daily"

  - id: task2
    name: "Task 2: Research Paper Abstract"
    task_type: "Document"
    description: >
      You have been given a research paper abstract. Write a prompt to make the
      AI extract the key information listed below from the abstract.
    document: "documents/sample_abstract.pdf"
    items:
      - id: 1
        label: "Paper title"
        answer: "Deep Learning for Natural Language Processing: A Survey"
      - id: 2
        label: "First author's name"
        answer: "Sarah Mitchell"
      - id: 3
